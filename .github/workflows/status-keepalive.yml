name: Keep Senviok status page awake

on:
  schedule:
    # Run slightly off the hour every six hours; each run pings for just under six hours.
    - cron: '11 */6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Ping status page at randomized intervals
        run: |
          python3 - <<'PY'
          import random
          import time
          import urllib.request

          url = "https://status.senviok.live/"
          intervals = [4, 6, 7, 10, 4, 7]
          deadline = time.monotonic() + (5 * 60 + 55) * 60

          def ping():
              for attempt in range(1, 5):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Senviok-Status-Keepalive/1.0"},
                      )
                      with urllib.request.urlopen(request, timeout=25) as response:
                          response.read(1)
                          print(f"{time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())}: HTTP {response.status}", flush=True)
                          return
                  except Exception as error:
                      print(f"Ping attempt {attempt} failed: {error}", flush=True)
                      if attempt < 4:
                          time.sleep(20)

          while True:
              ping()
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  break
              delay = random.choice(intervals) * 60
              if delay >= remaining:
                  time.sleep(remaining)
                  ping()
                  break
              print(f"Next request in {delay // 60} minutes", flush=True)
              time.sleep(delay)
          PY
